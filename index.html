<!doctype html>
<html>
  <head>
    <title>soundKILL</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <label for="audio_file_select_INPUT">Carica il file audio:</label>
    <input id="audio_file_select_INPUT" type="file" accept="audio/*" />
    <button id="audio_file_deselect_INPUT">Deseleziona il file</button>

    <br />
    <button id="activate_mic_input_BUTTON">Attiva input microfono</button>

    <div id="analysers_DIV">
      <canvas id="amplitude_analyser_CANVAS"></canvas>
      <canvas id="frequency_analyser_CANVAS"></canvas>
      <button id="spectrometer_log_BUTTON">Spectrometer log scale</button>
      <canvas id="spectrometer_CANVAS"></canvas>
      <canvas id="volume_analyzer_CANVAS"></canvas>
      <span
        >Current frequency:
        <p id="current_frequency_P"></p
      ></span>
      <div id="frequency_history_canvas_DIV">
        <canvas id="frequency_history_CANVAS"></canvas>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
